name: Release

# Automated GitHub Releases (closes #43).
# Pushing a version tag builds the distribution zips via build.sh and
# publishes them as release assets. The maintainer can edit the
# auto-generated notes afterwards to add the usual rich changelog.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches plugin manifests
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(grep -m1 '"version"' plugin.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag v$TAG does not match plugin.json version $MANIFEST" >&2
            exit 1
          fi

      - name: Validate manifests
        run: |
          python3 -c "import json; [json.load(open(f)) for f in ['plugin.json', '.claude-plugin/plugin.json', 'mcp.json']]"

      - name: Build packages
        run: bash build.sh

      - name: Generate checksums
        run: |
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
